<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catalogue Viewer - Light House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* Header */
        .viewer-header {
            flex-shrink: 0; 
            width: 100%;
            min-height: 64px;      
            height: auto;          
            background: #0a0a0a; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); 
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;    
            z-index: 50;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* PDF Container (Scroll Window) */
        .pdf-wrapper {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #2a2a2a;
            overflow: auto; /* Key: This handles the panning */
            -webkit-overflow-scrolling: touch;
            /* Added padding so Google Drive bottom bar isn't hidden behind inquiry dock */
            padding-bottom: 80px; 
        }

        /* Scale Container (Zoom Target) */
        .pdf-scale-container {
            width: 100%;
            height: 100%;
            transform-origin: top left;
            /* GPU Acceleration for smooth zoom */
            transform: translateZ(0);
            will-change: width, height;
            position: relative; /* Needed for shield positioning */
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            /* Prevent iframe from hijacking touch events completely */
            touch-action: pan-x pan-y;
        }

        /* --- POPOUT SHIELD (Blocks Google Drive Button) --- */
        .popout-shield {
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;   /* Covers the button area */
            height: 80px;  
            z-index: 60;   /* Higher than iframe */
            background: transparent; /* Invisible */
        }

        /* Watermark */
        .watermark-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><text x="50%" y="50%" font-family="Arial" font-size="20" fill="rgba(255,255,255,0.2)" transform="rotate(-45 100 100)" text-anchor="middle">LIGHT HOUSE 9979947925</text></svg>');
            background-repeat: repeat;
        }

        /* Zoom Controls */
        .zoom-dock {
            position: absolute;
            bottom: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* More space for fingers */
            z-index: 60;
        }

        .zoom-btn {
            width: 50px; /* Larger touch target */
            height: 50px;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            cursor: pointer;
            /* Fix for iOS active state sticky */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        .zoom-btn:active { transform: scale(0.95); background: #ffd700; color: black; border-color: #ffd700; }

        /* Inquiry Dock */
        .inquiry-dock {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 60;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .dock-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            width: 130px;
            font-size: 0.9rem;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }
        .dock-input:focus { border-color: #ffd700; background: black; }

        .dock-btn {
            flex-grow: 1;
            background: #25D366;
            color: white;
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .dock-btn:hover { background: #20bd5a; }

        .nav-title {
            font-family: 'Playfair Display', serif;
            color: #ffd700;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;       
            white-space: normal;    
            overflow: visible;
            flex: 1;                
            padding: 0 10px;        
            max-width: 60%;         
        }

        .nav-back {
            color: #f5f5f5;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
            text-decoration: none;
            flex-shrink: 0;         
            width: 70px;            
            cursor: pointer;
        }
        .nav-back:hover { color: #ffd700; }
        .header-spacer { width: 70px; flex-shrink: 0; }

        @media(max-width: 640px) {
            .viewer-header { padding: 10px 12px; }
            .nav-title { font-size: 1rem; }
            .inquiry-dock { bottom: 16px; flex-direction: row; padding: 8px; width: 95%; }
            .nav-back span { display: none; }
            .nav-back { width: auto; }
            .header-spacer { width: 20px; }
            /* Position Zoom controls for thumb access */
            .zoom-dock { bottom: 95px; right: 16px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Header -->
    <div class="viewer-header">
        <button onclick="handleBack()" class="nav-back">
            <i class="fas fa-chevron-left"></i> <span>Back</span>
        </button>
        <div id="catalogue-title" class="nav-title">Loading...</div>
        <div class="header-spacer"></div> 
    </div>

    <!-- PDF Wrapper -->
    <div class="pdf-wrapper" id="pdfWrapper">
        <div class="pdf-scale-container" id="pdfContainer">
            <!-- Shield to block Google Drive Pop-out -->
            <div class="popout-shield"></div>
            
            <div class="watermark-layer"></div>
            <!-- Removed sandbox to ensure PDF native controls work if available -->
            <iframe id="pdf-frame" src=""></iframe>
        </div>
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-dock">
        <!-- ontouchstart added for instant response on mobile -->
        <button class="zoom-btn" onclick="zoomIn()" ontouchstart="zoomIn()">
            <i class="fas fa-plus"></i>
        </button>
        <button class="zoom-btn" onclick="zoomOut()" ontouchstart="zoomOut()">
            <i class="fas fa-minus"></i>
        </button>
        <button class="zoom-btn" onclick="resetZoom()" ontouchstart="resetZoom()" style="font-size: 1rem;">
            <i class="fas fa-compress"></i>
        </button>
    </div> 

    <!-- Inquiry Dock -->
    <div class="inquiry-dock">
        <input type="text" id="page-input" class="dock-input" placeholder="Product/Page No" autocomplete="off">
        <a id="wa-link" href="#" target="_blank" class="dock-btn" onclick="updateLink()">
            <i class="fab fa-whatsapp text-lg"></i>
            <span>Inquire</span>
        </a>
    </div>

    <script>
        let currentFileName = 'Catalogue';
        let currentZoom = 100; 

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get('file');
            const fileName = params.get('name') || 'Catalogue';
            currentFileName = fileName;

            const iframe = document.getElementById('pdf-frame');
            
            if (fileUrl) {
                if (fileUrl.includes('drive.google.com')) {
                    let driveLink = fileUrl.replace('/view', '/preview').replace('/edit', '/preview');
                    iframe.src = driveLink;
                } else {
                    // CHANGED: Enabled toolbar (toolbar=1) to show page numbers for local files
                    iframe.src = fileUrl + "#toolbar=1&navpanes=0&view=FitH"; 
                }
                
                document.title = fileName + " - Light House";
                document.getElementById('catalogue-title').innerText = fileName;
            } else {
                document.getElementById('catalogue-title').innerText = "Select a File";
            }

            updateLink();
            setupSecurity();
        });

        function applyZoom() {
            const container = document.getElementById('pdfContainer');
            // Increasing BOTH width and height forces the browser to create scrollbars on the outer .pdf-wrapper
            container.style.width = `${currentZoom}%`;
            container.style.height = `${currentZoom}%`; 
        }

        function zoomIn(e) {
            if(e) e.preventDefault();
            if (currentZoom < 300) { 
                currentZoom += 25;
                applyZoom();
            }
        }

        function zoomOut(e) {
            if(e) e.preventDefault();
            if (currentZoom > 100) { 
                currentZoom -= 25;
                applyZoom();
            }
        }

        function resetZoom(e) {
            if(e) e.preventDefault();
            currentZoom = 100;
            applyZoom();
        }

        function updateLink() {
            const pageInput = document.getElementById('page-input').value.trim();
            const waLink = document.getElementById('wa-link');
            let message = pageInput 
                ? `Hi Light House, I'm looking at the *${currentFileName}* catalogue. I have a question about *Page/Code ${pageInput}*. Please assist.`
                : `Hi Light House, I'm viewing the *${currentFileName}* catalogue and have a question.`;
            waLink.href = `https://wa.me/919979947925?text=${encodeURIComponent(message)}`;
        }

        document.getElementById('page-input').addEventListener('input', updateLink);

        function handleBack() {
            if (window.history.length > 1 && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                try { window.close(); } catch (e) {}
                window.location.href = 'index2.html';
            }
        }

        function setupSecurity() {
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey && (e.key === 's' || e.key === 'p')) || e.key === 'PrintScreen') {
                    e.preventDefault();
                }
            });
        }
    </script>

</body>
</html>
